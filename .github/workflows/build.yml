name: Windows derlemesi

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Yayınla (portable klasör)
        run: >
          dotnet publish src/ServerController/ServerController.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishReadyToRun=true
          -p:DebugType=none
          -o publish/ServerController

      - name: Zip oluştur
        shell: pwsh
        run: Compress-Archive -Path publish/ServerController -DestinationPath publish/ServerController-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ServerController-win-x64
          path: publish/ServerController

      - name: Sürüm numarasını oku
        id: ver
        shell: pwsh
        run: |
          $v = ([xml](Get-Content src/ServerController/ServerController.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          "tag=v$v" >> $env:GITHUB_OUTPUT

      # main'e her gönderimde proje dosyasındaki sürüm (örn. 1.0.0 → v1.0.0) için Release oluşturur/günceller.
      - name: Sürüm (release) yayınla
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.ver.outputs.tag }}
          name: Server Controller ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: publish/ServerController-win-x64.zip
          body_path: .github/release-notes.md
